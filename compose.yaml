services:
  application:
    build:
      context: .
      dockerfile: Dockerfile
      target: runtime
    restart: unless-stopped
    init: true
    depends_on:
      migrate:
        condition: service_completed_successfully
    expose:
      - "4321"
    environment:
      DATABASE_URL: postgresql://postgres:${SERVICE_PASSWORD_64_DATABASE}@database:5432/scim_lab
      APP_ORIGIN: ${APP_ORIGIN:-https://scimlab.dev}
      APP_SECRET: ${SERVICE_HEX_64_APPLICATION}
      OIDC_ISSUER_URL: ${OIDC_ISSUER_URL:-}
      OIDC_CLIENT_ID: ${OIDC_CLIENT_ID:-}
      OIDC_CLIENT_SECRET: ${OIDC_CLIENT_SECRET:-}
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "const s=require('node:net').connect(4321,'127.0.0.1',()=>{s.end();process.exit(0)});s.on('error',()=>process.exit(1))",
        ]
      interval: 5s
      timeout: 5s
      retries: 12

  migrate:
    build:
      context: .
      dockerfile: Dockerfile
      target: migrator
    restart: "no"
    exclude_from_hc: true
    depends_on:
      database:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql://postgres:${SERVICE_PASSWORD_64_DATABASE}@database:5432/scim_lab

  database:
    image: postgres:16
    restart: unless-stopped
    environment:
      POSTGRES_DB: scim_lab
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${SERVICE_PASSWORD_64_DATABASE}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d scim_lab"]
      interval: 5s
      timeout: 5s
      retries: 12

volumes:
  pgdata:
