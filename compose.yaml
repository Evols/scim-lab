services:
  # ============================================================
  # SCIM Lab application
  # ============================================================
  application:
    build:
      context: .
      dockerfile: Dockerfile
      target: runtime

    restart: unless-stopped
    init: true

    depends_on:
      migrate:
        condition: service_completed_successfully

    expose:
      - "4321"

    environment:
      NODE_ENV: production

      DATABASE_URL: >-
        postgresql://scimlab:${SERVICE_PASSWORD_64_SCIM_DB}@database:5432/scim_lab

      APP_ORIGIN: ${APP_ORIGIN:-https://scimlab.dev}
      APP_SECRET: ${SERVICE_HEX_64_APP_SECRET}
      WORKSPACE_CREATIONS_PER_MINUTE: ${WORKSPACE_CREATIONS_PER_MINUTE:-2}

      OIDC_ISSUER_URL: ${OIDC_ISSUER_URL:-https://auth.scimlab.dev/oidc}
      OIDC_CLIENT_ID: ${OIDC_CLIENT_ID:-z3kp8emdt0f9pvugrds1i}
      OIDC_CLIENT_SECRET: ${OIDC_CLIENT_SECRET:-}
      OIDC_SCOPES: ${OIDC_SCOPES:-openid}

    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "const s=require('node:net').connect(4321,'127.0.0.1',()=>{s.end();process.exit(0)});s.on('error',()=>process.exit(1))",
        ]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 15s

  # ============================================================
  # Clean expired sessions and servers independently of console traffic.
  # Repeat bounded cleanup passes with a one-hour pause between cycles.
  maintenance:
    build:
      context: .
      dockerfile: Dockerfile
      target: runtime
    restart: unless-stopped
    exclude_from_hc: true
    init: true
    depends_on:
      migrate:
        condition: service_completed_successfully
    environment:
      DATABASE_URL: >-
        postgresql://scimlab:${SERVICE_PASSWORD_64_SCIM_DB}@database:5432/scim_lab
    command: ["node", "scripts/maintenance.mjs", "--apply", "--watch", "--interval-seconds=3600"]

  # ============================================================
  # SCIM Lab database migration
  # ============================================================
  migrate:
    build:
      context: .
      dockerfile: Dockerfile
      target: migrator

    restart: "no"
    exclude_from_hc: true

    depends_on:
      database:
        condition: service_healthy

    environment:
      DATABASE_URL: >-
        postgresql://scimlab:${SERVICE_PASSWORD_64_SCIM_DB}@database:5432/scim_lab

  # ============================================================
  # SCIM Lab PostgreSQL
  # ============================================================
  database:
    image: postgres:16-alpine

    restart: unless-stopped

    environment:
      POSTGRES_DB: scim_lab
      POSTGRES_USER: scimlab
      POSTGRES_PASSWORD: ${SERVICE_PASSWORD_64_SCIM_DB}

    volumes:
      - scim_pgdata:/var/lib/postgresql/data

    healthcheck:
      test: ["CMD-SHELL", "pg_isready -h 127.0.0.1 -U scimlab -d scim_lab"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 10s

  # ============================================================
  # Grafana: Logto-only access and versioned application metrics
  # ============================================================
  grafana:
    build:
      context: .
      dockerfile: infra/grafana/Dockerfile
      target: grafana
    restart: unless-stopped
    depends_on:
      metrics-setup:
        condition: service_completed_successfully
      logto:
        condition: service_healthy
    expose:
      - "3000"
    environment:
      GRAFANA_ORIGIN: ${GRAFANA_ORIGIN:-https://metrics.scimlab.dev}
      GRAFANA_SECRET_KEY: ${SERVICE_HEX_64_GRAFANA_SECRET}
      GRAFANA_OIDC_ISSUER_URL: ${OIDC_ISSUER_URL:-https://auth.scimlab.dev/oidc}
      GRAFANA_OIDC_CLIENT_ID: ${GRAFANA_OIDC_CLIENT_ID:-}
      GRAFANA_OIDC_CLIENT_SECRET: ${GRAFANA_OIDC_CLIENT_SECRET:-}
      GRAFANA_DATABASE_PASSWORD: ${SERVICE_PASSWORD_64_GRAFANA_DB:?Set SERVICE_PASSWORD_64_GRAFANA_DB in Coolify}
    volumes:
      - grafana_data:/var/lib/grafana
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1:3000/api/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 30s

  # Apply metrics views and rotate the restricted DB password on redeployment.
  metrics-setup:
    build:
      context: .
      dockerfile: infra/grafana/Dockerfile
      target: database-setup
    restart: "no"
    exclude_from_hc: true
    depends_on:
      migrate:
        condition: service_completed_successfully
    environment:
      PGHOST: database
      PGDATABASE: scim_lab
      PGUSER: scimlab
      PGPASSWORD: ${SERVICE_PASSWORD_64_SCIM_DB}
      GRAFANA_DATABASE_PASSWORD: ${SERVICE_PASSWORD_64_GRAFANA_DB:?Set SERVICE_PASSWORD_64_GRAFANA_DB in Coolify}

  # Expensive database scans run independently of interactive dashboard reads.
  metrics-refresh:
    build:
      context: .
      dockerfile: infra/grafana/Dockerfile
      target: database-setup
    restart: unless-stopped
    exclude_from_hc: true
    init: true
    depends_on:
      metrics-setup:
        condition: service_completed_successfully
    environment:
      PGHOST: database
      PGDATABASE: scim_lab
      PGUSER: scimlab
      PGPASSWORD: ${SERVICE_PASSWORD_64_SCIM_DB}
      PGAPPNAME: scim-lab-metrics-refresh
      METRICS_REFRESH_INTERVAL_SECONDS: ${METRICS_REFRESH_INTERVAL_SECONDS:-900}
    command: ["sh", "/opt/metrics/refresh.sh"]

  # ============================================================
  # Logto
  # ============================================================
  logto:
    image: svhd/logto:1.42.0

    restart: unless-stopped
    init: true

    depends_on:
      logto-alteration:
        condition: service_completed_successfully

    expose:
      - "3001"
      - "3002"

    environment:
      NODE_ENV: production

      DB_URL: >-
        postgresql://logto:${SERVICE_PASSWORD_64_LOGTO_DB}@logto-database:5432/logto

      PORT: "3001"
      ADMIN_PORT: "3002"

      TRUST_PROXY_HEADER: "1"

      ENDPOINT: ${LOGTO_ENDPOINT:-https://auth.scimlab.dev}
      ADMIN_ENDPOINT: ${LOGTO_ADMIN_ENDPOINT:-https://auth-admin.scimlab.dev}

      SECRET_VAULT_KEK: ${SERVICE_REALBASE64_32_LOGTO_KEK}

    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "const s=require('node:net').connect(3001,'127.0.0.1',()=>{s.end();process.exit(0)});s.on('error',()=>process.exit(1))",
        ]
      interval: 10s
      timeout: 5s
      retries: 18
      start_period: 20s

  # ============================================================
  # Initial Logto database seed
  #
  # --swe = skip when Logto configuration already exists.
  # This makes the step safe to run again on later deployments.
  # ============================================================
  logto-seed:
    image: svhd/logto:1.42.0

    restart: "no"
    exclude_from_hc: true

    depends_on:
      logto-database:
        condition: service_healthy

    environment:
      CI: "true"

      DB_URL: >-
        postgresql://logto:${SERVICE_PASSWORD_64_LOGTO_DB}@logto-database:5432/logto

    entrypoint:
      - sh
      - -c

    command:
      - >
        npm run cli db seed -- --swe

  # ============================================================
  # Logto database alterations
  #
  # Runs after seeding and before Logto itself.
  # On upgrades this applies pending Logto DB changes.
  # ============================================================
  logto-alteration:
    image: svhd/logto:1.42.0

    restart: "no"
    exclude_from_hc: true

    depends_on:
      logto-seed:
        condition: service_completed_successfully

    environment:
      CI: "true"

      DB_URL: >-
        postgresql://logto:${SERVICE_PASSWORD_64_LOGTO_DB}@logto-database:5432/logto

    entrypoint:
      - sh
      - -c

    command:
      - >
        npm run alteration deploy latest

  # ============================================================
  # Logto PostgreSQL
  # ============================================================
  logto-database:
    image: postgres:16-alpine

    restart: unless-stopped

    environment:
      POSTGRES_DB: logto
      POSTGRES_USER: logto
      POSTGRES_PASSWORD: ${SERVICE_PASSWORD_64_LOGTO_DB}

    volumes:
      - logto_pgdata:/var/lib/postgresql/data

    healthcheck:
      test: ["CMD-SHELL", "pg_isready -h 127.0.0.1 -U logto -d logto"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 10s

# ==============================================================
# Persistent storage
# ==============================================================
volumes:
  scim_pgdata:
  logto_pgdata:
  grafana_data:
