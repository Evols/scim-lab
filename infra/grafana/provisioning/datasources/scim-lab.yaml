apiVersion: 1
prune: true
datasources:
  - name: SCIM Lab metrics
    uid: scim-lab-metrics
    type: postgres
    access: proxy
    url: database:5432
    user: grafana_metrics
    isDefault: true
    editable: false
    jsonData:
      database: scim_lab
      postgresVersion: 1600
      sslmode: disable
      maxOpenConns: 2
      maxIdleConns: 1
      connMaxLifetime: 14400
      timescaledb: false
    secureJsonData:
      password: $GRAFANA_DATABASE_PASSWORD
