[server]
root_url = $__env{GRAFANA_ORIGIN}

[security]
disable_initial_admin_creation = true
secret_key = $__env{GRAFANA_SECRET_KEY}
cookie_secure = true
cookie_samesite = lax

[users]
allow_sign_up = false
allow_org_create = false

[auth]
disable_login_form = true
oauth_allow_insecure_email_lookup = false
login_maximum_lifetime_duration = 1d
login_maximum_inactive_lifetime_duration = 1h

[auth.basic]
enabled = false

[auth.anonymous]
enabled = false

[auth.generic_oauth]
enabled = true
name = Logto
allow_sign_up = true
auto_login = true
client_id = $__env{GRAFANA_OIDC_CLIENT_ID}
client_secret = $__env{GRAFANA_OIDC_CLIENT_SECRET}
scopes = openid profile email
auth_url = $__env{GRAFANA_OIDC_ISSUER_URL}/auth
token_url = $__env{GRAFANA_OIDC_ISSUER_URL}/token
api_url = $__env{GRAFANA_OIDC_ISSUER_URL}/me
auth_style = InHeader
use_pkce = true
validate_id_token = true
jwk_set_url = $__env{GRAFANA_OIDC_ISSUER_URL}/jwks
login_attribute_path = sub
email_attribute_path = email
; No fallback role: missing, unverified, or different email denies login.
role_attribute_path = email == 'hutteau.b@gmail.com' && email_verified == `true` && 'GrafanaAdmin'
role_attribute_strict = true
skip_org_role_sync = false
allow_assign_grafana_admin = true

[dashboards]
default_home_dashboard_path = /etc/grafana/dashboards/scim-lab.json

[analytics]
reporting_enabled = false
check_for_updates = false
