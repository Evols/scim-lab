name: Tests

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_DB: scim_lab
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/scim_lab
      APP_ORIGIN: http://localhost:4321
      APP_SECRET: scim-lab-github-actions-secret-at-least-32-bytes

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up pnpm and Node.js
        uses: pnpm/setup@v2
        with:
          runtime: node@22.12.0
          cache: true
          install: false

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Apply database migrations
        run: pnpm db:migrate

      - name: Run tests
        run: pnpm test

      - name: Verify metrics setup is repeatable and permissions are restricted
        env:
          GRAFANA_DATABASE_PASSWORD: ci-metrics-password
        run: |
          psql "$DATABASE_URL" --no-psqlrc --set=ON_ERROR_STOP=1 --file=infra/metrics/setup.sql
          psql "$DATABASE_URL" --no-psqlrc --set=ON_ERROR_STOP=1 --file=infra/metrics/setup.sql
          previous_password=$(psql "$DATABASE_URL" --no-psqlrc --tuples-only --no-align --command="SELECT rolpassword FROM pg_authid WHERE rolname = 'grafana_metrics'")
          if GRAFANA_DATABASE_PASSWORD='' psql "$DATABASE_URL" --no-psqlrc --file=infra/metrics/setup.sql; then
            echo 'Metrics setup unexpectedly accepted an empty password'
            exit 1
          fi
          if env -u GRAFANA_DATABASE_PASSWORD psql "$DATABASE_URL" --no-psqlrc --file=infra/metrics/setup.sql; then
            echo 'Metrics setup unexpectedly accepted a missing password'
            exit 1
          fi
          current_password=$(psql "$DATABASE_URL" --no-psqlrc --tuples-only --no-align --command="SELECT rolpassword FROM pg_authid WHERE rolname = 'grafana_metrics'")
          test -n "$previous_password"
          test "$previous_password" = "$current_password"
          PGHOST=127.0.0.1 PGDATABASE=scim_lab PGUSER=grafana_metrics PGPASSWORD="$GRAFANA_DATABASE_PASSWORD" \
            psql --no-psqlrc --set=ON_ERROR_STOP=1 --command='SELECT * FROM metrics.overview'
          psql "$DATABASE_URL" --no-psqlrc --file=infra/metrics/verify.sql
